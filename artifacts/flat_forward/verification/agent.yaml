seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 8000
empirical_normalization: true
policy:
  class_name: H2ActorCriticOur
  init_noise_std: 0.5
  noise_std_type: scalar
  actor_hidden_dims:
  - 256
  - 128
  - 64
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  fusion_type: mlp
  d_embed: 64
  n_heads: 4
  num_fusion_layers: 2
  dim_ff: 256
  fusion_dropout: 0.1
  num_joints: 29
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  symmetry_cfg: null
  rnd_cfg:
    weight: 25.0
    weight_schedule: null
    reward_normalization: true
    state_normalization: true
    learning_rate: 0.001
    num_outputs: 1
    predictor_hidden_dims:
    - -1
    target_hidden_dims:
    - -1
clip_actions: 100.0
save_interval: 100
experiment_name: h2_rough_manager_based
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
